# SagarDrishti Configuration File

pipeline:
  name: "SagarDrishti Oil Spill Detection & Attribution"
  version: "0.1.0"
  fallback_mode: true

data_sources:
  use_mock_if_missing: true
  sar_path: "data/raw/sentinel1_sample.tif"
  ais_path: "data/raw/ais_sample.parquet"
  currents_path: "data/raw/ocean_currents.nc"
  wind_path: "data/raw/wind_data.nc"

detection:
  confidence_threshold: 0.5
  speckle_filter_kernel: 5
  min_spill_area_km2: 0.1
  checkpoint_path: "models/checkpoints/spill_unet_resnet34.pth"

drift:
  n_particles: 500
  wind_drift_factor: 0.03   # Standard 3% wind drift approximation
  hindcast_hours: [1, 3, 6]
  forecast_hours: [1, 3, 6, 12]
  time_step_minutes: 15

ais:
  search_radius_km: 50.0
  time_window_hours: 6.0
  trajectory_tolerance_km: 5.0
  gap_threshold_minutes: 30

scoring:
  weights:
    spatial: 0.30
    temporal: 0.25
    trajectory: 0.20
    behaviour: 0.10
    ais_anomaly: 0.10
    vessel_relevance: 0.05
